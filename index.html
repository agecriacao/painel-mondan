<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de resultados · Clínica Mondän</title>
<link rel="icon" type="image/png" href="assets/simbolo_madeira.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navegação">
    <div class="side-brand">
      <img src="assets/logo_madeira.png" alt="Clínica Mondän" width="150" height="100">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <p class="side-label">Atualização dos dados</p>
      <ul class="fontes" id="fontes"></ul>
      <div class="side-age">
        <span>Desenvolvido por</span>
        <img src="assets/age.png" alt="AGE Criação" width="62" height="30">
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="mbar">
      <img src="assets/wordmark_madeira.png" alt="Clínica Mondän" height="26">
      <img src="assets/age.png" alt="AGE Criação" height="22">
    </header>
    <nav class="mnav" id="mnav" aria-label="Páginas"></nav>

    <div class="filtros" id="filtros" role="region" aria-label="Filtros">
      <div class="fgrp per-bar" id="f-per">
        <div class="per-seg" id="per-seg" role="tablist" aria-label="Período"></div>
        <label class="per-dt"><input type="date" id="dt-ini" aria-label="Data inicial"></label>
        <span class="per-a">a</span>
        <label class="per-dt"><input type="date" id="dt-fim" aria-label="Data final"></label>
        <label class="per-chk"><input type="checkbox" id="chk-cmp" checked> comparar com o período anterior</label>
      </div>

      <div class="fgrp fgrp-end">
        <label class="fld"><span>Especialidade</span><select id="sel-esp"></select></label>
      </div>
    </div>

    <main id="view" class="view" aria-live="polite">
      <p class="carregando" id="carregando">Carregando os números…</p>
    </main>

    <footer class="rodape">
      <p id="rodape-txt"></p>
      <p class="rodape-assin"><img src="assets/simbolo_madeira.png" alt="" width="20" height="20"> Clínica Mondän · painel de resultados preparado pela <img class="age" src="assets/age.png" alt="AGE Criação"> · apenas números agregados, sem dados de pacientes.</p>
    </footer>
  </div>
</div>
<div class="tip" id="tip" role="presentation"></div>
<script src="app.js"></script>
</body>
</html>
